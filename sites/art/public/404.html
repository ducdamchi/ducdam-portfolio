<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/dd.png" />
    <title>Duc Dam – Page Not Found</title>
    <script>
      // GitHub Pages SPA support:
      // Store the original path and let index.html restore it via history.replaceState.
      // This allows TanStack Router to handle the route client-side,
      // including showing its own notFoundComponent for truly invalid paths.
      sessionStorage.redirect = location.href
      location.replace('/')
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Candara', 'Optima', 'Helvetica', sans-serif;
        background-color: rgb(250, 250, 250);
        color: black;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
      }
      h1 {
        font-size: clamp(1.15rem, calc(2vw + 0.5rem), 1.6rem);
        font-weight: 900;
        letter-spacing: 0.02em;
      }
      p {
        font-size: clamp(0.8rem, calc(1.5vw + 0.4rem), 1rem);
      }
      a {
        font-size: clamp(0.8rem, calc(1.5vw + 0.4rem), 1rem);
        border: 1px solid black;
        padding: 0.5rem 1rem;
        text-decoration: none;
        color: black;
        background-color: rgb(250, 250, 250);
        transition: background-color 200ms, color 200ms;
      }
      a:hover {
        background-color: black;
        color: white;
      }
    </style>
  </head>
  <body>
    <noscript>
      <h1>PAGE NOT FOUND</h1>
      <p>The page you're looking for doesn't exist.</p>
      <a href="/">Go Home</a>
    </noscript>
  </body>
</html>
